# WolOS pacman.conf (ADR 0016, ADR 0030): one date per WolOS release; the first repo that has a
# package wins: [wolos], then the CachyOS x86-64-v3 repos (gated, rolling), then Arch. A WolOS update
# moves [wolos] and Arch to the next tested date; nothing else rolls in between.
[options]
HoldPkg = pacman glibc
# CachyOS v3 packages carry arch x86_64_v3 (.PKGINFO, checked 2026-11-01): both names are accepted.
# Harmless while the cachyos sections are off; `$arch` in a Server line is still x86_64.
Architecture = x86_64 x86_64_v3
# The package database belongs to the slot (A/B, ADR 0016), not the shared @var.
DBPath = /usr/lib/pacman/
CheckSpace
ParallelDownloads = 5
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

# WolOS: kernel, Hyprland, system, apps. Signed with the WolOS key.
[wolos]
Include = /etc/pacman.d/wolos-mirrorlist

# CachyOS x86-64-v3 builds of Arch packages (ADR 0030), reached through the WolOS CDN's /cachy/
# redirect (wolos-cachy-mirrorlist). Rolling, not pinned: turned on by `wol mirror gate` (installer,
# first boot) only on CPUs that run them. The three sections move together.
#[cachyos-v3]
#Include = /etc/pacman.d/wolos-cachy-mirrorlist

#[cachyos-core-v3]
#Include = /etc/pacman.d/wolos-cachy-mirrorlist

#[cachyos-extra-v3]
#Include = /etc/pacman.d/wolos-cachy-mirrorlist

[core]
Server = https://archive.archlinux.org/repos/2026/10/31/$repo/os/$arch

[extra]
Server = https://archive.archlinux.org/repos/2026/10/31/$repo/os/$arch

[multilib]
Server = https://archive.archlinux.org/repos/2026/10/31/$repo/os/$arch
