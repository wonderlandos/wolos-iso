# Live medium only (install-run removes it): sshd starts only when the boot was given a root key
# as the systemd credential ssh.authorized_keys.root (VM tests: wolvm --ssh, SMBIOS
# io.systemd.credential); systemd-tmpfiles' provision.conf writes it to /root/.ssh/authorized_keys.
# Never on by default: without the credential the unit is skipped.
[Unit]
ConditionCredential=ssh.authorized_keys.root
After=nftables.service systemd-tmpfiles-setup.service

[Service]
# The WolOS firewall drops what nobody asked for: port 22 opens with sshd, for this boot only.
ExecStartPre=-/usr/bin/nft add rule inet wolos input tcp dport 22 accept
