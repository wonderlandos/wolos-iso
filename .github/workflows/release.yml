# SPDX-License-Identifier: GPL-2.0-or-later
# A WolOS release: on a tag v*, build the ISO with mkarchiso on the ECS cluster from the published
# [wolos-testing] repo (wolos-build iso
# --ecs; never from a source tree), boot and install it in a VM, sign release.json, and publish the
# ISO, its .sha256 and release.json (+ release.json.sig) as the latest release of
# vars.WOLOS_RELEASES_REPO: release.json is what `update-check` and `wol update` read.
# Reusable: called only by wonderlandos/wolos .github/workflows/publish.yml (what=iso, run=<tag>),
# the one repo that holds the keys (explicit secrets); OIDC subject = wolos main, so vars.* are
# wolos's. The tag (vX.Y.Z) is a tag of wolos-iso; calling again re-runs its release (same checks).
# The runner never builds: it signs, tests and publishes. Then promote the packages to [wolos]
# (what=promote, wolos-pkgbuilds promote.yml).
# Every result also lands in s3://$BUCKET/runs/release-<tag>/dist/ (+ release.sh: the release
# writes). With secrets.WOLOS_RELEASES_TOKEN they run here; without it (the documented
# hand mode) nothing is written to the releases repo and a ::notice:: gives main the command to run
# with the lead's gh login. A missing signing key is always an error.
# Secrets: WOLOS_RELEASE_KEY (Ed25519 PEM, the package key: release.json.sig), WOLOS_SB_KEY /
# WOLOS_SB_CERT (PEM, Secure Boot, ADR 0025; with
# vars.WOLOS_SB_LAYOUT=1), WOLOS_RELEASES_TOKEN (optional: writes the releases repo). Variables:
# AWS_ROLE_ARN, AWS_REGION, CLUSTER, TASK_DEF_ISO, CAPACITY, BUCKET (the cluster, OIDC), WOLOS_RELEASES_REPO.
# The tool runs from the builder image (.github/builder, .github/builder-image; ECR over OIDC).
name: release

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag of wolos-iso (vX.Y.Z)
        type: string
        required: true
    secrets:
      WOLOS_RELEASE_KEY:
        required: true
      WOLOS_SB_KEY:
        required: false
      WOLOS_SB_CERT:
        required: false
      WOLOS_RELEASES_TOKEN:
        required: false

permissions:
  contents: read
  id-token: write   # AWS build cluster (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    # Required reviewers: the lead configures them on the `release` environment of the caller
    # repo (wolos, Settings > Environments > release). Signing secrets are passed explicitly.
    environment: release
    timeout-minutes: 360
    env:
      TAG: ${{ inputs.tag }}
      RUN: release-${{ inputs.tag }}
      BUCKET: ${{ vars.BUCKET }}
      # Releases (repo, ISO, release.json) live in a public repo anyone can download from: the
      # caller's token reads it, only writes need the releases token.
      GH_REPO: ${{ vars.WOLOS_RELEASES_REPO || 'wonderlandos/wolos-packages' }}
      GH_TOKEN: ${{ secrets.WOLOS_RELEASES_TOKEN || github.token }}
      UPLOAD: ${{ secrets.WOLOS_RELEASES_TOKEN != '' && '1' || '0' }}
      WOLOS_SB_LAYOUT: ${{ vars.WOLOS_SB_LAYOUT || '0' }}
    steps:
      - name: Inputs
        run: |
          case $TAG in v[0-9]*.*) ;; *) echo "::error::tag '$TAG' is not vX.Y.Z"; exit 1 ;; esac
          [ -n "$BUCKET" ] || { echo "::error::vars.BUCKET is not set in the calling repo"; exit 1; }
          [ "$UPLOAD" = 1 ] || echo "::notice::no WOLOS_RELEASES_TOKEN: hand mode, $GH_REPO is only read"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: wonderlandos/wolos-iso
          ref: refs/tags/${{ inputs.tag }}
          path: wolos-iso

      - name: AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      # The tool: the builder image (.github/builder-image), not a checkout of the private repo.
      - name: Builder registry
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      # mkarchiso (archlinux, privileged task) on a whole host, from [wolos-testing] as published.
      - name: ISO on the build cluster
        env:
          CLUSTER: ${{ vars.CLUSTER }}
          TASK_DEF_ISO: ${{ vars.TASK_DEF_ISO }}
          CAPACITY: ${{ vars.CAPACITY }}
          BUCKET: ${{ vars.BUCKET }}
          WOLOS_REPO_NAME: wolos-testing
          WOLOS_IMAGE_URL: https://github.com/${{ vars.WOLOS_RELEASES_REPO || 'wonderlandos/wolos-packages' }}/releases/download/${{ inputs.tag || github.ref_name }}
        run: WOLOS_ISO=$PWD/wolos-iso wolos-iso/.github/builder wolos-build iso --ecs --out out/iso

      - name: Release files
        run: |
          mkdir -p dist
          iso=$(ls -t out/iso/wolos-*.iso | head -1)
          mv "$iso" dist/
          cp "${iso%.iso}.json" dist/release.json   # release/release-manifest.sh, written by build.sh
          (cd dist && sha256sum "$(basename "$iso")" > "$(basename "$iso").sha256")
          cat dist/release.json

      # Unattended install in QEMU/KVM, then the installed disk boots on its own (tests/test-install.sh).
      - name: VM boot test
        run: |
          iso=$(ls dist/*.iso)
          docker run --rm --device /dev/kvm -v "$PWD:/src" -w /src archlinux:latest bash -euo pipefail -c "
            pacman -Sy --noconfirm --needed qemu-base edk2-ovmf libarchive util-linux python python-pillow mtools dosfstools swtpm >/dev/null
            WOLOS_VM=/src/out/vm sh wolos-iso/tests/test-install.sh $iso || true
            cat /src/out/vm/test/checks.txt"
          grep -q 'BOOT PASS' out/vm/test/checks.txt && ! grep -q 'FAIL' out/vm/test/checks.txt

      # Secure Boot: sign systemd-boot and the UKI of the shim layout, then boot the image in OVMF
      # with Secure Boot on. The image changes, so its hash, size and manifest follow.
      - name: Secure Boot
        env:
          SB_KEY: ${{ secrets.WOLOS_SB_KEY }}
          SB_CERT: ${{ secrets.WOLOS_SB_CERT }}
        run: |
          iso=$(python3 -c 'import json; print(json.load(open("dist/release.json"))["image"].rsplit("/", 1)[1])')
          if [ -n "$SB_KEY" ] && [ -n "$SB_CERT" ]; then
            (umask 077; printf '%s\n' "$SB_KEY" > "$RUNNER_TEMP/sb.key"; printf '%s\n' "$SB_CERT" > "$RUNNER_TEMP/sb.crt")
            docker run --rm --device /dev/kvm -v "$PWD:/src" -v "$RUNNER_TEMP:/keys" -w /src archlinux:latest bash -euo pipefail -c "
              pacman -Sy --noconfirm --needed mtools sbsigntools openssl python util-linux qemu-base edk2-ovmf virt-firmware >/dev/null
              wolos-iso/release/sb-layout.sh sign dist/$iso /keys/sb.key /keys/sb.crt
              wolos-iso/tests/test-secureboot.sh dist/$iso /keys/sb.crt"
            rm -f "$RUNNER_TEMP/sb.key"
            sudo chown -R "$(id -u)" dist
            (cd dist && sha256sum "$iso" > "$iso.sha256")
            python3 - "dist/$iso" <<'PY'
          import hashlib, json, os, sys
          f = sys.argv[1]; m = json.load(open("dist/release.json")); h = hashlib.sha256()
          with open(f, "rb") as r:
              for b in iter(lambda: r.read(1 << 20), b""): h.update(b)
          m["sha256"], m["size"] = h.hexdigest(), os.path.getsize(f)
          json.dump(m, open("dist/release.json", "w"), separators=(",", ":"))
          PY
          elif [ "$WOLOS_SB_LAYOUT" = 1 ]; then
            # Unsigned, the shim layout is an image that fails on every PC with Secure Boot on: not a release.
            echo "::error::WOLOS_SB_LAYOUT=1 without WOLOS_SB_KEY/WOLOS_SB_CERT: the image would not boot with Secure Boot on; add the secrets or set WOLOS_SB_LAYOUT=0"
            exit 1
          fi

      - name: Sign release.json
        env:
          KEY: ${{ secrets.WOLOS_RELEASE_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "::error::no WOLOS_RELEASE_KEY: release.json unsigned, updates would not offer it"; exit 1; }
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/release.pem"
          wolos-iso/release/sign-release.sh dist/release.json "$RUNNER_TEMP/release.pem"
          rm -f "$RUNNER_TEMP/release.pem"

      # In $GH_REPO, where update-check reads releases/latest/download/release.json and the CDN
      # pulls <tag>/<file> from. The writes, run in dist/: here (token) or by main (hand mode).
      - name: Publish the release
        run: |
          snap=$(tr -d '[:space:]' < wolos-iso/profile/snapshot)
          mkdir -p out/publish
          printf 'TAG=%s\nsnap=%s\n' "$TAG" "$snap" > out/publish/release.sh
          cat >> out/publish/release.sh <<'SH'
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "WolOS ${TAG#v}" --latest \
              --notes "WolOS ${TAG#v}: the ISO, its .sha256 and release.json. Packages: release wolos-$snap ([wolos]) and wolos-testing."
          gh release upload "$TAG" --clobber ./*.iso ./*.sha256 release.json release.json.sig
          gh release edit "$TAG" --latest
          SH
          s3=s3://$BUCKET/runs/$RUN
          aws s3 sync --quiet --delete dist/ "$s3/dist/"
          aws s3 cp --quiet out/publish/release.sh "$s3/release.sh"
          echo "release files: $s3/dist/" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$UPLOAD" = 1 ]; then (cd dist && sh -eu ../out/publish/release.sh); exit 0; fi
          d=wolos-$RUN
          cmd="mkdir -p $d && aws s3 sync $s3/ $d/ && (cd $d/dist && GH_REPO=$GH_REPO sh -eux ../release.sh)"
          { echo "### Not published: no WOLOS_RELEASES_TOKEN (hand mode)"; echo '```'; echo "$cmd"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Release built and signed, not published (no WOLOS_RELEASES_TOKEN)::Publish with your gh login: $cmd"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ inputs.tag }}
          path: |
            dist/*.sha256
            dist/release.json
            dist/release.json.sig
            out/publish/
          retention-days: 14
