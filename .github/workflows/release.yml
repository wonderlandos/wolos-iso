# SPDX-License-Identifier: GPL-2.0-or-later
# A WolOS release. The ISO is built and VM-tested where it is built, on the forge (BF-9; never in a
# rolling container on this runner), from the published [wolos-testing] repo, and left in
# s3://$BUCKET/runs/release-<tag>/iso/ (BUILD.md "Release"):
#   wolos-build iso --out DIR && WOLOS_VM=V sh wolos-iso/tests/test-install.sh --release DIR &&
#   cp V/test/checks.txt DIR/ && aws s3 sync DIR/ s3://$BUCKET/runs/release-<tag>/iso/
# Here: that ISO (its checks.txt must say BOOT PASS and no FAIL), Secure Boot signing and its OVMF
# boot when the keys are set, then `wolos-build release --do --iso` (lib/publish.sh in wolos-build):
# release.json (image URL on the release, sha256 and size of the image as published), its Ed25519
# signature (release/sign-release.sh), the .sha256, and the latest release of
# vars.WOLOS_RELEASES_REPO: release.json is what `update-check` and `wol update` read.
# Reusable: called only by wonderlandos/wolos .github/workflows/publish.yml (what=iso, run=<tag>),
# the one repo that holds the keys (explicit secrets); OIDC subject = wolos main, so vars.* are
# wolos's. The tag (vX.Y.Z) is the release tag `wolos-build release vX.Y.Z` put on all four repos
# (ADR 0029); calling again re-runs its release (same checks). The runner never builds: it signs and
# publishes. Then promote the packages to [wolos] (what=promote, wolos-pkgbuilds promote.yml).
# Every result also lands in s3://$BUCKET/runs/release-<tag>/dist/. With secrets.WOLOS_RELEASES_TOKEN
# the release is written here; without it (hand mode, WOLOS_GH_RECORD) the writes go to
# s3://$BUCKET/runs/release-<tag>/release.sh and a ::notice:: gives main the command to run with
# the lead's gh login. A missing signing key is always an error.
# Secrets: WOLOS_RELEASE_KEY (Ed25519 PEM, the package key: release.json.sig), WOLOS_SB_KEY /
# WOLOS_SB_CERT (PEM, Secure Boot, ADR 0025; with
# vars.WOLOS_SB_LAYOUT=1), WOLOS_RELEASES_TOKEN (optional: writes the releases repo). Variables:
# AWS_ROLE_ARN, AWS_REGION, BUCKET (S3 and ECR over OIDC), WOLOS_RELEASES_REPO, WOLOS_SB_LAYOUT.
# The tool runs from the builder image (.github/builder, .github/builder-image; ECR over OIDC).
name: release

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag of wolos-iso (vX.Y.Z)
        type: string
        required: true
    secrets:
      WOLOS_RELEASE_KEY:
        required: true
      WOLOS_SB_KEY:
        required: false
      WOLOS_SB_CERT:
        required: false
      WOLOS_RELEASES_TOKEN:
        required: false

permissions:
  contents: read
  id-token: write   # S3 and ECR (the builder image) over OIDC

# Every run: script is bash -eo pipefail (a failing stage of a pipeline fails the step).
defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    # Required reviewers: the lead configures them on the `release` environment of the caller
    # repo (wolos, Settings > Environments > release). Signing secrets are passed explicitly.
    environment: release
    timeout-minutes: 120
    env:
      TAG: ${{ inputs.tag }}
      RUN: release-${{ inputs.tag }}
      BUCKET: ${{ vars.BUCKET }}
      # Releases (repo, ISO, release.json) live in a public repo anyone can download from: the
      # caller's token reads it, only writes need the releases token.
      GH_REPO: ${{ vars.WOLOS_RELEASES_REPO || 'wonderlandos/wolos-packages' }}
      GH_TOKEN: ${{ secrets.WOLOS_RELEASES_TOKEN || github.token }}
      UPLOAD: ${{ secrets.WOLOS_RELEASES_TOKEN != '' && '1' || '0' }}
      WOLOS_SB_LAYOUT: ${{ vars.WOLOS_SB_LAYOUT || '0' }}
    steps:
      - name: Inputs
        run: |
          case $TAG in v[0-9]*.*) ;; *) echo "::error::tag '$TAG' is not vX.Y.Z"; exit 1 ;; esac
          [ -n "$BUCKET" ] || { echo "::error::vars.BUCKET is not set in the calling repo"; exit 1; }
          [ "$UPLOAD" = 1 ] || echo "::notice::no WOLOS_RELEASES_TOKEN: hand mode, $GH_REPO is only read"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: wonderlandos/wolos-iso
          ref: refs/tags/${{ inputs.tag }}
          path: wolos-iso

      - name: AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      # The tool: the builder image (.github/builder-image), not a checkout of the private repo.
      - name: Builder registry
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      # The ISO built and VM-tested on the forge, with the manifest build.sh wrote next to it.
      - name: The tested ISO
        run: |
          mkdir -p dist && aws s3 sync --quiet --exclude '*' --include '*.iso' --include '*.json' --include 'checks.txt' "s3://$BUCKET/runs/$RUN/iso/" dist/
          [ -f dist/checks.txt ] || { echo "::error::no s3://$BUCKET/runs/$RUN/iso/checks.txt: the ISO was not VM-tested (BUILD.md Release)"; exit 1; }
          if ! grep -q 'BOOT PASS' dist/checks.txt || grep -q 'FAIL' dist/checks.txt; then echo "::error::the VM test of the ISO did not pass"; cat dist/checks.txt; exit 1; fi
          rm -f dist/checks.txt dist/release.json; find dist -maxdepth 1 -type f -printf '%s %f\n' | tee -a "$GITHUB_STEP_SUMMARY"

      # Secure Boot: sign systemd-boot and the UKI of the shim layout, then boot the image in OVMF
      # with Secure Boot on. The image changes: `release --rehash` takes its hash and size as it is then.
      - name: Secure Boot
        env:
          SB_KEY: ${{ secrets.WOLOS_SB_KEY }}
          SB_CERT: ${{ secrets.WOLOS_SB_CERT }}
        run: |
          iso=$(cd dist && find . -maxdepth 1 -name '*.iso' -printf '%f')
          if [ -n "$SB_KEY" ] && [ -n "$SB_CERT" ]; then
            (umask 077; printf '%s\n' "$SB_KEY" > "$RUNNER_TEMP/sb.key"; printf '%s\n' "$SB_CERT" > "$RUNNER_TEMP/sb.crt")
            # An image the build box already signed with the pinned live key keeps its tested bytes;
            # otherwise the secrets must be that same key (a stray pair would give an image no PC boots).
            docker run --rm --device /dev/kvm -v "$PWD:/src" -v "$RUNNER_TEMP:/keys" -w /src archlinux:latest bash -euo pipefail -c '
              pacman -Sy --noconfirm --needed mtools sbsigntools openssl python util-linux qemu-base edk2-ovmf virt-firmware >/dev/null
              iso=dist/'"$iso"'; pin=wolos-iso/release/wolos-live-2026.cer
              fp() { openssl x509 -noout -fingerprint -sha256 -inform DER -in "$1" 2>/dev/null || openssl x509 -noout -fingerprint -sha256 -inform PEM -in "$1"; }
              if wolos-iso/release/sb-layout.sh check "$iso"; then
                echo "secure boot: already signed by the pinned live key; not signed again"
              else
                [ "$(fp /keys/sb.crt)" = "$(fp "$pin")" ] || { echo "::error::WOLOS_SB_CERT is not the pinned live key ($pin)"; exit 1; }
                [ "$(openssl x509 -in /keys/sb.crt -noout -pubkey)" = "$(openssl pkey -in /keys/sb.key -pubout)" ] || { echo "::error::WOLOS_SB_KEY does not belong to WOLOS_SB_CERT"; exit 1; }
                wolos-iso/release/sb-layout.sh sign "$iso" /keys/sb.key /keys/sb.crt
              fi
              export WOLOS_SB_TEST=/src/dist/.sb-test
              wolos-iso/tests/test-secureboot.sh "$iso" wolos-iso/release/wolos-live-2026.crt ||
                { echo "::group::serial log"; tail -n 80 /src/dist/.sb-test/serial.log 2>/dev/null; echo "::endgroup::"; exit 1; }
              rm -rf /src/dist/.sb-test'
            rm -f "$RUNNER_TEMP/sb.key"; sudo chown -R "$(id -u)" dist
            echo "SB_SIGNED=1" >> "$GITHUB_ENV"
          elif [ "$WOLOS_SB_LAYOUT" = 1 ]; then
            # Unsigned, the shim layout is an image that fails on every PC with Secure Boot on: not a release.
            echo "::error::WOLOS_SB_LAYOUT=1 without WOLOS_SB_KEY/WOLOS_SB_CERT: the image would not boot with Secure Boot on; add the secrets or set WOLOS_SB_LAYOUT=0"
            exit 1
          fi

      # release.json + signature + .sha256 + the signed stable feed (stable.json + .sig), then the
      # release of $GH_REPO (here, or recorded for main in hand mode), and dist/ to
      # s3://$BUCKET/runs/release-<tag>/: all `wolos-build release`.
      - name: Sign and publish the release
        env:
          WOLOS_RELEASE_KEY: ${{ secrets.WOLOS_RELEASE_KEY }}
        run: |
          export WOLOS_ISO=$PWD/wolos-iso WOLOS_SUMMARY=$PWD/out/summary.md WOLOS_WORK=$PWD/out/work
          [ "$UPLOAD" = 1 ] || export WOLOS_GH_RECORD=$PWD/out/release.sh
          wolos-iso/.github/builder wolos-build release --do --iso dist ${SB_SIGNED:+--rehash} --run "$RUN" "$TAG"
          [ ! -f out/summary.md ] || cat out/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ inputs.tag }}
          path: |
            dist/*.sha256
            dist/release.json
            dist/release.json.sig
            dist/stable.json
            dist/stable.json.sig
            out/release.sh
          if-no-files-found: ignore
          retention-days: 14
