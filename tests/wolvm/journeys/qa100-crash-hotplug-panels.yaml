# QA-100 H25 (crash-surface) CRASH-1, extends DEV2-1: plugging a second display ends wol-shell not
# only with the Control Center open: Notification Center and Clipboard did it too (each 1/1, same
# "unknown object ... remove_surface(o)" from the compositor, focus_grab.rs:255-280), while Session,
# Overview, Widgets, Shortcuts, Themes, Force Quit and the lock screen survived (1/1 each), and the
# Control Center survived this run (DEV2-1 saw 2/2): the death is intermittent, so every panel is
# plugged three times. Needs two heads: `wolvm new ... --displays 2` (see qa100-dev2-display-hotplug-cc).
#   wolvm journey crash tests/wolvm/journeys/qa100-crash-hotplug-panels.yaml
name: crash-surface, a display plugged with any panel open never ends the shell
steps:
- wait-agent:
  timeout: 120
- ssh: "mountpoint -q /sys/kernel/debug || mount -t debugfs none /sys/kernel/debug; P=$(pgrep -u 1000 -x wol-shell | head -1); tr '\\0' '\\n' < /proc/$P/environ | grep -E '^(WAYLAND_DISPLAY|HYPRLAND_INSTANCE_SIGNATURE|DBUS_SESSION_BUS_ADDRESS|XDG_RUNTIME_DIR|HOME|USER)=' > /tmp/sess.env; wc -l < /tmp/sess.env"
  expect: "6"
- ssh: |
    F=$(ls /sys/kernel/debug/dri/*/Virtual-2/force | head -1); R="runuser -u $(id -nu 1000) -- env $(tr '\n' ' ' < /tmp/sess.env)"
    dead=0
    for p in control-center notifications clipboard session overview widgets shortcuts themes force-quit; do
      for n in 1 2 3; do
        $R wol shell show $p; sleep 1.5
        echo on > $F; udevadm trigger --action=change --subsystem-match=drm; sleep 3
        pgrep -u 1000 -x wol-shell >/dev/null || { dead=$((dead+1)); echo "DIED $p $n"; $R sh -c 'setsid wol-shell 2>>/run/user/1000/wol-shell.log </dev/null >/dev/null &'; sleep 5; }
        echo off > $F; udevadm trigger --action=change --subsystem-match=drm; sleep 3
        $R wol shell hide transient; $R wol shell hide $p; sleep 1
      done
    done
    echo "deaths=$dead"
  expect: "deaths=0"
  save: hotplug-matrix.txt
  caption: CRASH-1, 0.12.1 run 2026-11-04 had deaths with notifications and clipboard open
- ssh: "journalctl -b --no-pager | grep -E 'remove_surface|client communication' | tail -6"
  save: protocol-errors.txt
- shot: after-matrix
- logs:
  n: 200
