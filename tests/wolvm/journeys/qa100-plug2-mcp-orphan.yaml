# QA100-R2-plugins: an MCP client that dies while its approval sheet is on screen. Expected: the sheet
# closes (or at least its answer runs nothing). 0.12.1: the sheet stays and Allow Once runs the change
# (PLUG2-1 in .claude/v012/qa100/plugins-maker-r2.md). Needs: an installed VM with account bob logged in
# at the desktop (the first steps set the password and log in through the login window at 1280x800).
name: an MCP client gone, its sheet approved
steps:
- start
- wait-agent:
  timeout: 600
- ssh: "echo bob:qa100plug | chpasswd; echo pw-set"
  expect: "pw-set"
- wait-stable:
  timeout: 120
- click: 719 590
  caption: the bob tile on the login window
- type: qa100plug
- key: ret
- wait-stable:
  timeout: 90
- ssh: "mkdir -p /home/bob/qa; echo  | base64 -d > /home/bob/qa/mcp.py; echo  | base64 -d > /home/bob/qa/orphan.sh; chown -R bob:bob /home/bob/qa; echo ok"
  expect: "ok"
- ssh: "su -l bob -c 'sh ~/qa/orphan.sh'"
  expect: "ABANDON"
- ssh: "pgrep -c -x wol || true"
  save: wol-procs.txt
- wait-stable:
  timeout: 20
- checkpoint: orphan-sheet
  caption: PLUG2-1/PLUG-24 the sheet of a client that no longer exists is still on screen
- click: 932 395
  caption: Allow Once on the orphan sheet
- sleep: 3
- ssh: "cat /home/bob/.config/wolos/theme"
  expect: "wol-light"
  caption: expected unchanged; 0.12.1 gives wol-dark (the change ran for nobody)
