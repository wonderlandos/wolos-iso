# QA-100 H2: the daily update check and `wol update check` on an installed disk, online and offline.
# Needs a VM made from install-auto.yaml (checkpoint installed-up) with the network up:
#   wolvm snapshot-restore inst installed-up && wolvm journey inst tests/wolvm/journeys/qa100-update-check.yaml
# Expected behaviour (H2 report, findings U1, U2, U7):
#   - an up-to-date system answers `wol update check` with "up to date" / [] and exit 0, never
#     "pacman -Qu failed" (pacman -Qu exits 1 when nothing is pending: U1)
#   - offline, update-check leaves no stamp and `wol update check` says "are you online", exit != 0
#   - a release manifest counts only with a good signature, in the shell's reading too (U7)
name: update check, online and offline
steps:
- start
- wait-agent:
  timeout: 600
- wait-stable:
  timeout: 180
# The journey waits 2 x 330 s with no input; the session locks at 300 s idle (hypridle), and a locked screen
# shows no clickable banner (final run 2026-11-05: step 19 failed with the lock screen up). A logind idle
# inhibitor held for the journey keeps hypridle from locking. NOT yet run on a VM.
- ssh: "setsid -f systemd-inhibit --what=idle --who=qa100-update-check --why='keep the session unlocked for the banner click' --mode=block sleep 1500 >/dev/null 2>&1; sleep 1; systemd-inhibit --list --no-pager | grep -c qa100-update-check"
  rc: any
  save: inhibit.txt
  caption: an idle inhibitor keeps the desktop from locking during the long waits
- ssh: "systemctl list-timers --no-pager --all | grep -E 'wolos-update-(check|download)' || true"
  save: timers.txt
  caption: the hourly check and the daily download timers exist
- ssh: "systemctl is-enabled wolos-update-check.timer && echo timer-enabled"
  expect: "timer-enabled"
# A fresh check while online.
- ssh: "rm -f /var/lib/wolos/updates/checked; /usr/lib/wolos/update-check now; echo rc=$?; ls -l /var/lib/wolos/updates"
  rc: any
  save: update-check-now.txt
- ssh: "test -s /var/lib/wolos/updates/checked && test -e /var/lib/wolos/updates/pkg && echo check-stamped"
  expect: "check-stamped"
  caption: online, the check leaves its stamp and its package list
- ssh: "wol update status; echo rc=$?"
  rc: any
  save: update-status.txt
- ssh: "out=$(wol update check --json 2>&1); rc=$?; echo \"rc=$rc out=$out\"; test $rc = 0 && echo check-ok"
  expect: "check-ok"
  save: update-check-json.txt
  caption: "U1: a system with nothing pending still answers (exit 0, a JSON list), never 'pacman -Qu failed'"
- ssh: "pacman -Qu >/dev/null; echo pacman-Qu-rc=$?"
  rc: any
  save: pacman-qu-rc.txt
  caption: what the real pacman answers for -Qu with nothing pending (1 means U1 bites)
# QA-STORE-57 (first-login-no-banner): the release a fresh install runs is not an update. The
# check's signed base is the running version, so `wol update status` counts 0 and the shell, which
# applies the same `installed(running)` filter, never posts "Updates Available".
- ssh: "echo running: $(cat /usr/lib/wolos-release.json); echo status: $(wol update status --json); wol update status --json | grep -q 'count.:0' && echo count-zero"
  expect: "count-zero"
  save: first-login-no-banner.txt
  caption: first-login-no-banner - a release equal to the running one counts 0
- ssh: "sleep 330; ! grep -q 'Updates Available' /home/alice/.local/state/wolos/notify.json 2>/dev/null && echo no-updates-banner"
  timeout: 400
  expect: "no-updates-banner"
  caption: first-login-no-banner - two due polls later the notification history has no "Updates Available"
# click-notice (live-1 M1): a banner "Updates Available" has a default action that opens Software
# Update. Forge one newer package in the check's findings, wait for the due poll, click the banner.
- ssh: "cd /var/lib/wolos/updates && printf 'wol-shell 0.12.1-1 -> 0.12.9-1\\n' > pkg && date +%s > checked && chmod 644 pkg checked && echo forged-package-update"
  expect: "forged-package-update"
  caption: click-notice - a package update the shell has not told about yet
- ssh: "sleep 330; su -l alice -c 'WAYLAND_DISPLAY=wayland-1 XDG_RUNTIME_DIR=/run/user/$(id -u alice) pgrep -f \"notify-send -a WolOS -w -A default=Open\" >/dev/null && echo banner-waits-for-click'"
  timeout: 400
  rc: any
  expect: "banner-waits-for-click"
  caption: click-notice - the banner process waits on the default=Open action (a banner without it would have no process)
- screenshot: click-notice-banner
- note: "EDIT the click below to the banner's centre from click-notice-banner.png (top right, under the menu bar), then rerun from this step."
- click: 1500 90
  caption: click-notice - click the banner
- wait-stable:
  timeout: 20
- ssh: "pgrep -u $(id -u alice) -af 'wol-settings.*software-update' && echo settings-opened-on-software-update"
  rc: any
  expect: "settings-opened-on-software-update"
  caption: "click-notice - the click opened Settings on Software Update: the banner runs `wol-settings software-update` (shell software_update::OPEN, the page id), not the title 'Software Update'"
- ssh: "rm -f /var/lib/wolos/updates/pkg /var/lib/wolos/updates/checked"
  rc: any
# Offline: no stamp, an honest sentence.
- ssh: "nmcli networking off || ip link set dev $(ip -o route get 1.1.1.1 2>/dev/null | awk '{print $5}') down; sleep 2; ip -br addr"
  rc: any
  save: offline.txt
- ssh: "rm -f /var/lib/wolos/updates/checked; /usr/lib/wolos/update-check now; test ! -e /var/lib/wolos/updates/checked && echo no-stamp-offline"
  expect: "no-stamp-offline"
  caption: offline, the daily check leaves no stamp (the next hour tries again)
- ssh: "out=$(wol update check 2>&1); rc=$?; echo \"rc=$rc out=$out\"; test $rc != 0 && echo offline-refused"
  expect: "offline-refused"
  save: update-check-offline.txt
  caption: offline, `wol update check` never claims 'up to date'
- ssh: "wol update check 2>&1 | grep -qi 'online' && echo says-online"
  expect: "says-online"
  caption: the sentence tells the person to check the connection, not 'pacman -Qu failed'
# U7: a manifest with a bad signature must not count, for `wol` nor for the shell's own reading.
- ssh: "cd /var/lib/wolos/updates && printf '{\"version\":\"9999.12\",\"snapshot\":\"2099/12/31\",\"wolos_repo\":\"r1\",\"kernel\":\"1\",\"image\":\"x\",\"sha256\":\"%s\"}' $(printf a%.0s $(seq 64)) > base && printf 00 > base.sig && date +%s > checked && wol update status --json"
  rc: any
  save: forged-base.txt
- ssh: "wol update status --json | grep -q '\"base\":null' && echo forged-ignored"
  expect: "forged-ignored"
  caption: an unsigned manifest is not an update (wol)
- ssh: "rm -f /var/lib/wolos/updates/base /var/lib/wolos/updates/base.sig /var/lib/wolos/updates/checked; nmcli networking on || true"
  rc: any
- logs:
  n: 400
- stop
