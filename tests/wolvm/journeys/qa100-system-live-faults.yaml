# SPDX-License-Identifier: GPL-2.0-or-later
# QA-100 H6 (system-stability): the live image under fault injection. Daemons the shell relies on
# are killed one by one from the guest agent; each must come back (or be shown absent) without the
# session, wold or the compositor going down. Collects the system facts a stability review asks for
# (journal size and noise, failed units, sysctl, swap, time, locale, plymouth theme, cmdline).
# wolvm new faults --iso wolos.iso && wolvm journey faults tests/wolvm/journeys/qa100-system-live-faults.yaml
name: live image survives daemon crashes; system facts collected
steps:
- start
- wait-text: "Install WolOS: the first screen of the live image"
  timeout: 300
- wait-agent:
  timeout: 300
- wait-stable:
  timeout: 120
  caption: the installer session has settled
- ssh: "timeout 180 systemctl is-system-running --wait; systemctl --failed --no-legend --plain"
  rc: any
  save: 00-system-state.txt
  caption: boot finished; the failed-unit list (must be empty)
- ssh: "cat /proc/cmdline; echo; plymouth-set-default-theme; echo; cat /etc/plymouth/plymouthd.conf 2>/dev/null; echo; cat /etc/mkinitcpio.conf.d/*.conf"
  rc: any
  save: 01-boot-chain.txt
- ssh: "journalctl -b --disk-usage; cat /etc/systemd/journald.conf.d/*.conf 2>/dev/null; echo; journalctl -b --no-pager | wc -l; echo warnings:; journalctl -b -p warning --no-pager | wc -l; echo errors:; journalctl -b -p err --no-pager | wc -l"
  rc: any
  save: 02-journal-size.txt
  caption: journal size and the number of warning/error lines in one boot
- ssh: "journalctl -b -p warning --no-pager -o short-monotonic | sed -E 's/^\\[ *[0-9.]+\\] [^ ]+ //' | sed -E 's/[0-9]+/N/g' | sort | uniq -c | sort -rn | head -60"
  rc: any
  save: 03-journal-noise-top.txt
  caption: the most repeated warning/error lines (log noise)
- ssh: "sysctl kernel.printk vm.swappiness vm.page-cluster kernel.sched_autogroup_enabled fs.file-max 2>&1; swapon --show; cat /sys/kernel/mm/lru_gen/min_ttl_ms /sys/kernel/mm/transparent_hugepage/defrag; findmnt /tmp /dev/shm -o TARGET,OPTIONS"
  rc: any
  save: 04-kernel-tuning.txt
- ssh: "timedatectl; echo; localectl; echo; cat /etc/locale.gen | grep -v '^#' ; echo; locale -a"
  rc: any
  save: 05-time-locale.txt
- ssh: "systemctl show -p Restart -p RestartUSec -p NRestarts -p StartLimitBurst -p StartLimitIntervalUSec wold.service NetworkManager.service bluetooth.service iwd.service cups.service avahi-daemon.service systemd-timesyncd.service seatd.service wolos-xguard.service"
  rc: any
  save: 06-restart-policies.txt
  caption: restart policies of the daemons the session depends on
- ssh: "pgrep -a wold; pgrep -a wol-login; pgrep -a wol-loginwindow; pgrep -a wol-shell; pgrep -a Hyprland; pgrep -a hyprland; journalctl -b -u wold --no-pager | tail -40"
  rc: any
  save: 07-session-processes.txt
- checkpoint: before-faults
- ssh: "systemctl kill -s SIGKILL NetworkManager.service; sleep 8; systemctl is-active NetworkManager.service; systemctl show -p NRestarts --value NetworkManager.service"
  rc: any
  expect: active
  save: 10-kill-networkmanager.txt
  caption: NetworkManager killed with SIGKILL comes back
- ssh: "systemctl kill -s SIGKILL iwd.service; sleep 6; systemctl is-active iwd.service; systemctl show -p NRestarts --value iwd.service"
  rc: any
  save: 11-kill-iwd.txt
  caption: iwd killed (Wi-Fi backend)
- ssh: "systemctl kill -s SIGKILL bluetooth.service; sleep 6; systemctl is-active bluetooth.service; systemctl show -p NRestarts --value bluetooth.service"
  rc: any
  save: 12-kill-bluetooth.txt
  caption: bluetoothd killed: does it come back
- ssh: "systemctl kill -s SIGKILL avahi-daemon.service; sleep 6; systemctl is-active avahi-daemon.service; systemctl show -p NRestarts --value avahi-daemon.service"
  rc: any
  save: 13-kill-avahi.txt
- ssh: "systemctl kill -s SIGKILL seatd.service; sleep 8; systemctl is-active seatd.service; systemctl show -p NRestarts --value seatd.service; pgrep -a Hyprland; pgrep -a wol-login"
  rc: any
  save: 14-kill-seatd.txt
  caption: seatd killed: the compositor's seat daemon
- wait-stable:
  timeout: 90
- shot after-seatd
- ssh: "u=$(loginctl list-sessions --no-legend | awk '{print $3}' | head -1); echo user=$u; pkill -9 -u \"$u\" -x pipewire; pkill -9 -u \"$u\" -x wireplumber; sleep 6; pgrep -u \"$u\" -a pipewire; pgrep -u \"$u\" -a wireplumber; systemctl --user -M \"$u@\" is-active pipewire.service wireplumber.service pipewire-pulse.service 2>&1"
  rc: any
  save: 15-kill-pipewire.txt
  caption: pipewire and wireplumber killed in the session
- ssh: "systemctl kill -s SIGKILL wold.service; sleep 10; systemctl is-active wold.service; systemctl show -p NRestarts --value wold.service; pgrep -a wol-login; pgrep -a wol-admind; pgrep -a Hyprland; ls -la /run/wold.sock /run/wol-qos.sock /run/wol-memsaver.sock 2>&1"
  rc: any
  expect: active
  save: 16-kill-wold.txt
  caption: wold killed: must restart and bring the login job and admind back
- wait-stable:
  timeout: 120
- shot after-wold
- ssh: "p=$(pgrep -x wol-shell | head -1); echo shell=$p; [ -n \"$p\" ] && kill -9 $p; sleep 8; pgrep -a wol-shell; u=$(loginctl list-sessions --no-legend | awk '{print $3}' | head -1); cat /run/user/$(id -u \"$u\")/wol-shell.log 2>/dev/null | tail -20"
  rc: any
  save: 17-kill-shell.txt
  caption: the shell killed (SIGKILL): the supervisor brings it back
- wait-stable:
  timeout: 90
- shot after-shell
- ssh: "for i in 1 2 3 4 5 6; do systemctl kill -s SIGKILL wold.service; sleep 1.5; done; sleep 8; systemctl is-active wold.service; systemctl show -p NRestarts -p Result -p ActiveState --value wold.service; systemctl status wold.service --no-pager | head -12"
  rc: any
  save: 18-wold-crash-storm.txt
  caption: six wold crashes in ten seconds: the start limit, a black screen if it trips
- sleep 10
- shot after-wold-storm
- ssh: "systemctl --failed --no-legend --plain; echo; journalctl -b -p err --no-pager | tail -60"
  rc: any
  save: 19-after-faults.txt
- ssh: "mkdir -p /tmp/fill && dd if=/dev/zero of=/tmp/fill/big bs=1M count=100000 2>&1 | tail -2; df -h /tmp | tail -1; echo test > /tmp/fill/after 2>&1; echo rc=$?; rm -rf /tmp/fill; df -h /tmp | tail -1; sleep 3; pgrep -a wol-shell | head -2; systemctl is-active wold"
  rc: any
  save: 20-tmp-full.txt
  caption: /tmp filled to its limit (25% of RAM) and emptied again; the shell and wold live on
- logs:
  n: 800
- stop
