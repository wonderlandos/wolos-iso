# QA-100 H3: the computer loses power in the middle of an install, then the person installs again.
# The disk after the cut is half-written (partitions, maybe an open LUKS volume); the second run must
# finish, the disk must boot with one WolOS entry, and nothing of the first try may linger (no stray
# /dev/mapper/wolos* on the live system, no second ESP). Make the VM with the autoinstall words:
#   wolvm new cut --iso wolos.iso --tpm --direct --append "wolos.autoinstall=/dev/vda wolos.autologin=yes"
#   wolvm journey cut tests/wolvm/journeys/qa100-install-power-loss.yaml
name: power loss during an install, then a second install on the same disk
steps:
- start
- power-cut: "files 15"
  timeout: 900
  delay: 20
  caption: the first install reached "Copying WolOS" (wolos-install: files 15); 20 s later the power cut (qemu killed, nothing synced)
- start:
  caption: the stick again, the same autoinstall words
- wait-agent:
  timeout: 300
- ssh: "lsblk -o NAME,SIZE,TYPE,FSTYPE,PARTLABEL /dev/vda; ls /dev/mapper"
  rc: any
  save: disk-after-cut.txt
  caption: what the cut left on the disk (for the report; the installer must cope with any of it)
- wait-text: "wolos-install: done"
  timeout: 1800
  caption: the second install finished
# 0.13 (seal in seconds): the VM powers off right after "done", so no ssh here (the two checks that used to follow raced the
# poweroff: TimeoutError). The partition check moved to the booted system below; "no volume left open" is not observable from the
# installed system (its own root is a mapper device) and is not checked by this journey any more.
- wait-text: "reboot: Power down"
  timeout: 300
  shot: false
- stop
- boot disk
- start
- wait-agent:
  timeout: 600
- ssh: "timeout 120 systemctl is-system-running --wait"
  expect: "running"
  caption: the installed system comes up clean
- ssh: "cd /efi/loader/entries && LC_ALL=C ls | grep '^wolos-' | tr '\\n' ' '"
  expect: "wolos-a-fallback.conf wolos-a.conf"
  caption: "0.13 boot design (ADR 0025, Fallback entry): the slot's blessed entry and its blessed fallback entry, and nothing else of WolOS (no counted leftovers of the cut install)"
- ssh: "cd /efi/loader/entries && ls | grep -c '^wolos-' && ls | grep -c '^wolos-a-fallback[.]conf$' && ls | grep -c '^wolos-a[.]conf$'"
  expect: "2\n1\n1"
  caption: exactly two WolOS entries on the ESP, one of each kind
- ssh: "cd /efi/loader/entries && grep -h '^sort-key' wolos-a.conf wolos-a-fallback.conf | tr '\\n' ' '; for e in wolos-a.conf wolos-a-fallback.conf; do img=$(sed -n 's/^uki //p' $e); test -f \"/efi$img\" || { echo dangling=$e; exit 1; }; done"
  expect: "sort-key wolos sort-key wolos.fallback"
  caption: the fallback sorts after the entry (sort-key wolos.fallback) and both name an image that is on the ESP
- ssh: "lsblk -no PARTTYPE /dev/vda | grep -ic c12a7328-f81f-11d2-ba4b-00a0c93ec93b"
  expect: "1"
  caption: exactly one startup partition (the first try's partitions did not pile up); moved here from before the poweroff
- ssh: "tail -n 20 /var/log/wolos-install.log"
  rc: any
  save: install-log-tail.txt
- logs:
  n: 500
