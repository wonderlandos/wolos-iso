# SPDX-License-Identifier: GPL-2.0-or-later
# QA-100 H11 (network) NET-1, NET-2, NET-3, NET-4, NET-5, NET-7, NET-8: the firewall unit is a
# oneshot that is "inactive" one second after boot, so Firewall Off unloads nothing, "not running
# now" shows on every boot and try-reload-or-restart is a no-op; .local names never resolve on
# WolOS; AirPlay advertises a port the firewall drops; no Wi-Fi hardware reads as Wi-Fi On and
# `wol wifi join` exits 0 on failure. Runs from the welcome screen (no desktop needed).
#   wolvm new net --iso wolos.iso --ssh
#   wolvm journey net tests/wolvm/journeys/qa100-net-firewall-state.yaml
name: "network, part 1: firewall unit state, .local, AirPlay ports, Wi-Fi without hardware"
steps:
- start
- wait-agent:
  timeout: 300
# NET-2: the unit is inactive while its rules are loaded; Privacy says "not running now".
- ssh: "systemctl show nftables -p ActiveState -p Type -p RemainAfterExit | paste -sd' '; echo rules=$(nft list ruleset | grep -c accept); wol firewall --json | tr -d ' \\n'"
  rc: any
  expect: "\"running\":true"
  save: firewall-unit.txt
  caption: "FIXED (NET-2): the unit stays active (RemainAfterExit=yes) and firewall running is true while the table is loaded; BUG if ActiveState=inactive with rules>0 and running false"
# NET-1: Firewall Off (disable --now) leaves every rule loaded.
- ssh: "before=$(nft list ruleset | grep -c accept); systemctl disable --now nftables.service >/dev/null 2>&1; after=$(nft list ruleset | grep -c accept); echo \"before=$before after=$after\""
  rc: any
  expect: "after=0"
  save: firewall-off.txt
  caption: "step rules-after-off==0 (NET-1): Firewall off unloads every rule; BUG if after == before"
# NET-3: the reload the Remote Login fix relies on does nothing on an inactive oneshot unit.
- ssh: "systemctl enable --now nftables.service >/dev/null 2>&1; systemctl is-active nftables.service; systemctl reload nftables.service 2>&1; echo reload-rc=$?; journalctl -b -u nftables --no-pager | tail -1"
  rc: any
  expect: "reload-rc=0"
  save: firewall-reload.txt
  caption: "FIXED (NET-3): the unit is active after start, reload works; BUG if reload-rc=1 'not active, cannot reload'"
# Back on: the live ssh path stays open (NET-13: the rule is /etc/wolos/nftables.d/live-ssh.conf,
# read by every load of the ruleset; `nft add rule` was lost by enable --now).
- ssh: "systemctl restart nftables.service >/dev/null 2>&1; echo ssh22=$(nft list ruleset | grep -c 'dport 22')"
  rc: any
  expect: "ssh22=1"
  save: live-ssh-rule.txt
  caption: "step live-ssh-rule-in-nftables.d (NET-13): port 22 survives a firewall restart; BUG if ssh22=0"
# NET-4 (B7): .local through nss-mdns (wolos-system's nsswitch-mdns puts mdns_minimal before
# resolve); resolved keeps MulticastDNS=no (one mDNS stack) and has no third-party FallbackDNS.
- ssh: "grep '^hosts' /etc/nsswitch.conf; resolvectl status --no-pager 2>/dev/null | grep -i -m1 'fallback' || echo no-fallback; (avahi-publish -a -R qa100test.local 10.0.2.15 >/dev/null 2>&1 &); sleep 2; timeout 5 getent hosts qa100test.local; echo getent-rc=$?; pkill avahi-publish"
  rc: any
  expect: "getent-rc=0"
  save: mdns-resolve.txt
  caption: "step .local (NET-4): getent resolves an avahi name (mdns_minimal before resolve) and resolved lists no fallback servers; BUG if getent-rc != 0"
# NET-5 (B7): AirPlay Receiver on through wol-admind writes nftables.d/airplay.conf and reloads:
# every port shairport-sync listens on is matched by the ruleset (ss -lnp is a subset of nft).
- ssh: "wol admin airplay-receiver on >/dev/null 2>&1; sleep 3; ports=$(ss -lntup | awk '/shairport/ {n=split($5,a,\":\"); print a[n]}' | sort -u); echo ports=$ports; miss=0; for p in $ports; do nft list ruleset | grep -qE \"dport .*\\b$p\\b|$p-|-$p\" || { echo missing=$p; miss=1; }; done; echo miss=$miss; wol admin airplay-receiver off >/dev/null 2>&1; echo after-off=$(nft list ruleset | grep -cE 'dport \\{ 5000, 7000 \\}')"
  rc: any
  expect: "miss=0"
  save: airplay-ports.txt
  caption: "step ss -lnp is a subset of nft (NET-5): every shairport-sync port is open while the receiver is on, closed again after off (after-off=0); BUG if missing=<port>"
# NET-7 and NET-8: no Wi-Fi device: the radio reads none, a join says "no Wi-Fi device" and exits non-zero.
- ssh: "nmcli -t -f TYPE dev | grep -c wifi; wol wifi | tr -d '\\n '; echo; echo foo12345 | wol wifi join Foo 2>&1; echo join-rc=$?"
  rc: any
  expect: "\"on\":null"
  save: wifi-no-hardware.txt
  caption: "FIXED (NET-7): no Wi-Fi device reads on:null; FIXED (NET-8, B7): the message names the missing Wi-Fi device and join-rc is not 0; BUG if it says password or join-rc=0"
- checkpoint: qa100-net-firewall-state
- stop
