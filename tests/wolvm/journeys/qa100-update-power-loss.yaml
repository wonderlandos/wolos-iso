# QA-100 H2: the power goes while a system update builds the other slot. The computer must start
# again from the running slot, and the next update must succeed (the half-made slot or the scratch
# subvolume from the cut must not block it).
# Needs a VM from install-auto.yaml (checkpoint installed-up), network up.
# Findings covered: U8 (leftover @wolos-tx / half slot), U3 (entry without a slot after the cut).
name: power loss in the middle of a slot update
steps:
- start
- wait-agent:
  timeout: 600
- wait-stable:
  timeout: 180
- ssh: "cat /proc/cmdline | tr ' ' '\\n' | grep rootflags; bootctl list --json=short; ls /efi/loader/entries"
  save: before.txt
# Start the update in the background and cut the power once pacman is inside the new slot.
- ssh: "nohup sh -c 'wol update apply --yes >/tmp/apply.log 2>&1' >/dev/null 2>&1 & echo started"
  expect: "started"
- ssh: "n=0; while [ $n -lt 600 ] && ! grep -q 'arch-chroot.*pacman' /tmp/apply.log; do sleep 2; n=$((n+2)); done; sleep 20; tail -3 /tmp/apply.log"
  timeout: 700
  rc: any
  save: at-cut.txt
  caption: pacman is running inside the new slot when the power goes
- stop
- start
- wait-agent:
  timeout: 600
  caption: the computer starts again by itself
- wait-stable:
  timeout: 180
- ssh: "cat /proc/cmdline"
  expect: "subvol=@wolos-a"
  caption: the running slot (the restore point) boots; the half-made slot never does
- ssh: "timeout 120 systemctl is-system-running --wait"
  expect: "running"
- ssh: "ls /efi/loader/entries /efi/EFI/wolos; btrfs subvolume list /run/wolos/top | grep -o '@wolos-[ab]\\|@wolos-tx'; bootctl list --no-pager"
  rc: any
  save: after-cut.txt
- ssh: "for e in /efi/loader/entries/wolos-*.conf; do [ -f \"$e\" ] || continue; img=$(sed -n 's/^uki //p' \"$e\"); s=$(basename \"$e\" .conf | sed 's/+.*//'); test -f \"/efi$img\" && btrfs subvolume list /run/wolos/top | grep -q \"@$s\\$\" || { echo dangling=$e; exit 1; }; done; echo entries-consistent"
  expect: "entries-consistent"
  caption: "U3: every boot entry has its image and its slot"
- ssh: "wol update status 2>&1; wol restore list 2>&1"
  rc: any
  save: status-after-cut.txt
# The next update must work in one go.
- ssh: "timeout 1700 wol update apply --yes >/tmp/apply2.log 2>&1; echo rc=$?; tail -5 /tmp/apply2.log"
  timeout: 1800
  rc: any
  save: apply-after-cut.txt
- ssh: "grep -q 'updated into wolos-b' /tmp/apply2.log && echo recovered-first-try"
  expect: "recovered-first-try"
  caption: "U8: the update after a power cut succeeds at the first try (leftovers are cleaned, not reported as a failure)"
- ssh: "btrfs subvolume list /run/wolos/top | grep -c '@wolos-tx' | grep -q '^0$' && echo no-scratch-left"
  expect: "no-scratch-left"
- logs:
  n: 600
- stop
