# SPDX-License-Identifier: GPL-2.0-or-later
# QA-100 H11 (network) NET-6, NET-2, NET-3: on the live medium Remote Login (and AirPlay, Firewall,
# Computer name) opens an Authenticate sheet for the `live` account, whose password is locked:
# Allow with an empty field does nothing, a typed password fails and nothing is said. Privacy &
# Security says the firewall is "not running now" on every boot. After the int fix lands, the last
# step checks that Remote Login opens port 22 at once (a root-side run of the same plan).
#   wolvm new net --iso wolos.iso --ssh
#   wolvm journey net tests/wolvm/journeys/qa100-net-sharing-live.yaml
name: "network, part 3: Sharing on the live medium, Remote Login and the firewall"
steps:
- start
- wait-agent:
  timeout: 300
- wait-stable:
  timeout: 120
- click: 710 599
  caption: Try WolOS (1280x800)
# Known wait (30 s): the session hand-off after Try WolOS draws black/partial frames before the desktop; wait-stable alone passed on them (IMAGE-013).
- sleep: 30
- wait-stable:
  timeout: 120
  caption: live desktop
- ssh: "passwd -S live | cut -d' ' -f2; runuser -u live -- env HOME=/home/live XDG_RUNTIME_DIR=/run/user/1000 WAYLAND_DISPLAY=wayland-1 setsid -f wol-settings Sharing >/dev/null 2>&1; sleep 4; pgrep -u 1000 -x wol-settings >/dev/null && echo settings-running"
  expect: "settings-running"
  save: live-password-state.txt
  caption: "L = locked: no password exists for the live account"
- wait-stable:
  timeout: 40
- shot: sharing-live
  caption: "FIXED (NET-6, NET2-8; B7): no Remote Login row on the live medium, Computer name and AirPlay Receiver greyed, footnote 'Install WolOS to change these. The live system's account has no password to allow them.', Internet Sharing row; BUG if Remote Login shows or a row takes a click"
- click: 1035 306
  caption: where the Remote Login switch was (now greyed or empty)
- sleep: 3
- shot: sharing-no-sheet
  caption: "FIXED (NET-6): no Authenticate sheet opened; BUG if a sheet asks for the live account's password"
- ssh: "journalctl -b --no-pager | grep -iE 'remote-login' | tail -2; systemctl is-enabled sshd"
  rc: any
  save: remote-login-journal.txt
  caption: "FIXED (NET-6): no 'authentication failed' line from this run, sshd still disabled"
- ssh: "pkill -u 1000 -x wol-settings; sleep 1; runuser -u live -- env HOME=/home/live XDG_RUNTIME_DIR=/run/user/1000 WAYLAND_DISPLAY=wayland-1 setsid -f wol-settings Network >/dev/null 2>&1; sleep 4; echo opened"
  rc: any
  expect: "opened"
- wait-stable:
  timeout: 60
- shot: network-firewall-row
  caption: "FIXED (NET-2, NET-22): the Firewall row is in Network and reads the Blocks-connections sentence; BUG if it reads 'On at startup, but not running now.' while nft list ruleset has the table"
- ssh: "pkill -u 1000 -x wol-settings; echo closed"
  rc: any
  expect: "closed"
# NET-3 / PRIV-5: the Remote Login plan as root (what wol-admind runs): rule file, ruleset loaded
# again, sshd. Is port 22 open right away, without a reboot?
- ssh: "install -d /etc/wolos/nftables.d; printf '%s\\n' 'tcp dport 22 ct state new limit rate 10/minute accept' > /etc/wolos/nftables.d/ssh.conf; nft -f /etc/wolos/nftables.conf; echo load-rc=$?; echo dport22=$(nft list ruleset | grep -c 'limit rate 10/minute'); printf '%s\\n' '# Remote Login is off: port 22 stays closed.' > /etc/wolos/nftables.d/ssh.conf; nft -f /etc/wolos/nftables.conf; echo closed=$(nft list ruleset | grep -c 'limit rate 10/minute')"
  rc: any
  expect: "dport22=1"
  save: remote-login-reload.txt
  caption: "step dport 22 (NET-3): the loaded ruleset has the rule at once; BUG if dport22=0. After Remote Login off: closed=0"
- checkpoint: qa100-net-sharing-live
- stop
