name: Settings, every page opened (25 sidebar panes and the subpages), then one sidebar click and the search box
# Each page is asked for with `wol-settings "<page>"` (the documented deep link); the window must stay
# alive, repaint (a different picture than the page before) and leave no panic in the user journal.
from: desktop
