# SPDX-License-Identifier: GPL-2.0-or-later
# QA hunt 1, classes (a) and (b): System Settings by keyboard only. Every sidebar page is reached
# with the arrow keys (a focus ring must sit on exactly one control: the row the cursor is on, never
# the search row, a gap, a card or the page), then on each page Tab moves through the controls and
# Esc leaves the page as it was. The agent inspects every screenshot (Read tool): ONE accent ring,
# on a leaf control, no ring around a list row box, card, section or page (QA 0.12.0 bug 1), no
# empty outlined box between groups (bug 2), and Up from "Wi-Fi" lands IN the search field, not on a
# ring around it (hunt-1 B1, needs brief Y).
# Needs an installed disk with the test account (Alice Liddell / curiouser) and a shell >= 796d66e.
# wolvm journey <vm> tests/wolvm/journeys/qa-settings-keynav.yaml
name: Settings keyboard traversal, focus rings and sidebar arrows
steps:
- start
- wait-agent:
  timeout: 300
- wait-stable:
  timeout: 180
  caption: login window
- type: curiouser
- key: ret
- wait-stable:
  timeout: 120
  caption: desktop up
# Launch helper: Settings as the person, on their Wayland display. Later launches re-use the window.
- ssh: "u=$(id -nu 1000); h=$(getent passwd 1000 | cut -d: -f6); WD=$(ls /run/user/1000 | grep -m1 '^wayland-[0-9]*$'); runuser -u \"$u\" -- env HOME=\"$h\" XDG_RUNTIME_DIR=/run/user/1000 WAYLAND_DISPLAY=\"$WD\" setsid -f wol-settings Wi-Fi >/dev/null 2>&1; sleep 3; pgrep -u 1000 -x wol-settings >/dev/null && echo settings-running"
  expect: "settings-running"
  caption: System Settings opens on Wi-Fi (the first sidebar row)
- wait-stable:
  timeout: 60
- shot: keynav-00-open
  caption: "ASSERT (a): no focus ring anywhere yet, or one ring on the first row only"
# Class (b): Up from the first page row. Tab once puts the focus in the sidebar list (search field first).
- key: tab
- shot: keynav-01-tab-search
  caption: "ASSERT: the ring is inside the search field (entry), not a rectangle around the search ROW (hunt-1 B1)"
- key: tab
- shot: keynav-02-tab-sidebar
  caption: "ASSERT: ring on the Wi-Fi row only"
- key: up
- shot: keynav-03-up-from-first
  caption: "ASSERT (B1, needs brief Y): focus went into the search entry (caret visible), no ring around an empty row"
- type: wall
- wait-stable:
  timeout: 20
- shot: keynav-04-search-wall
  caption: "search narrows the sidebar to Wallpaper; no gap space while searching"
- key: esc
- key: backspace backspace backspace backspace
- wait-stable:
  timeout: 20
- key: tab
- key: down
- shot: keynav-05-back-on-rows
  caption: "ASSERT: ring on one row; the group gaps are plain space (bug 2)"
# ---- Sidebar walk: Down once per page; a ring on the new row and nothing else. Groups end after
# Network, Sound, Battery, Users & Groups, Hardware: the Down across a group boundary must land on
# the next page row directly (bug 2), with no empty outlined box (screenshots 10, 14, 24, 27, 31).
