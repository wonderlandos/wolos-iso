- key: tab tab tab tab
- shot: page-wi-fi-tab8
  caption: "ASSERT (a): same, further down Wi-Fi"
- key: esc
- wait-stable:
  timeout: 20
- shot: page-wi-fi-esc
  caption: "ASSERT: Esc changed nothing (same values as tab8) and Settings is still open"
