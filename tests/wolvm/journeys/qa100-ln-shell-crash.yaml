# QA100-H24 launcher-notify LN-20: the desktop must come back after the shell dies. On 0.12.1 the
# session starts `wol-shell --supervised` but no supervisor process exists (crates/shell/src/supervise.rs
# is absent in rel/0.12.1): SIGKILL on the only wol-shell leaves a black screen with no menu bar, Dock
# or wallpaper until logout. On wave3/int the supervisor must restart it and the Notification Center
# must come back from notify.json.
# QA-LIVE-22 (the end of the journey): a COMPOSITOR crash. Stock start-hyprland relaunches
# `Hyprland --safe-mode`, which drops the WolOS config (no shell, no lock bindings, no theme, an
# "autogenerated config" banner). hyprland-wolos patch 0018 restarts it with the same arguments and
# config behind the crash lock, never --safe-mode; a second crash within 30 s ends start-hyprland
# with 1, the session ends and the login window comes back.
# wolvm journey <vm> tests/wolvm/journeys/qa100-ln-shell-crash.yaml
name: The shell comes back after a crash and keeps the Notification Center
steps:
- start
- wait-agent:
  timeout: 300
- wait-stable:
  timeout: 180
  caption: login window
- click: [720, 590]
- sleep: 1.5
- type: tester123
- key: ret
- wait-stable:
  timeout: 120
  caption: desktop session up
- ssh: "runuser -u tester -- env XDG_RUNTIME_DIR=/run/user/1000 DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus notify-send -a Keep 'Survive a crash?' 'sent before the crash'; sleep 1; ps -o pid,ppid,args -C wol-shell"
  caption: on int EXPECT two rows (supervisor + shell); 0.12.1 shows one
- ssh: "child=$(pgrep -x wol-shell | tail -1); kill -9 $child; sleep 6; ps -o pid,ppid,args -C wol-shell; ls -la /home/tester/.local/state/wolos/notify.json 2>&1"
  rc: any
  caption: EXPECT a new wol-shell row within 6 s
- sleep: 2
- shot: ln-shell-after-crash
  caption: EXPECT menu bar, Dock and wallpaper. BUG LN-20 if the screen is black
- click: [1210, 14]
- sleep: 1.5
- shot: ln-center-after-crash
  caption: EXPECT 'Survive a crash?' listed in the Notification Center (int keeps notify.json)
# Timing (QA-LIVE-22). WolosRestart::REPEAT_WINDOW is 30 s: the give-up needs two crashes inside it.
# So the journey crashes the compositor THREE times: the first one is checked at leisure (lock
# screen, unlock, desktop), then 35 s are let pass so the window is empty again, the second shows a
# restart after a quiet period, and the third follows the second at once (the poll of the second
# returns as soon as the new Hyprland and the launcher are up, a few seconds), which is the give-up.
# Nothing waits on a fixed sleep for the restart: each kill polls for a new Hyprland pid beside a
# live start-hyprland (30 s at most) and prints what it saw.
- ssh: "old=$(pgrep -u tester -x Hyprland | head -1); pkill -KILL -u tester -x Hyprland; i=0; while [ $i -lt 60 ]; do n=$(pgrep -u tester -x Hyprland | head -1); if [ ${n:-0} -gt 0 ] && [ ${n:-0} -ne ${old:-0} ] && pgrep -u tester -x start-hyprland >/dev/null; then break; fi; sleep 0.5; i=$((i+1)); done; echo hypr=$(pgrep -u tester -c -x Hyprland) launcher=$(pgrep -u tester -c -x start-hyprland) safe=$(pgrep -u tester -af Hyprland | grep -c -e --safe-mode) new=$([ ${n:-0} -ne ${old:-0} ] && echo yes)"
  expect: "hypr=1 launcher=1 safe=0 new=yes"
  caption: QA-LIVE-22, crash 1, a compositor crash restarts Hyprland (a new pid) by the same launcher and never with --safe-mode (0.12.1 prints safe=1)
- shot: compositor-after-crash
  caption: EXPECT the WolOS lock screen (crash lock), the password field, no stock "autogenerated config" text. BUG QA-LIVE-22 if a bare desktop with a Hyprland banner
- type: tester123
- key: ret
- wait-stable:
  timeout: 60
  caption: unlocked
- shot: compositor-after-unlock
  caption: EXPECT the menu bar, Dock and wallpaper again (the shell and its config came back with the compositor)
- sleep: 35
  caption: more than REPEAT_WINDOW since crash 1, so crash 2 is a first crash again
- ssh: "old=$(pgrep -u tester -x Hyprland | head -1); pkill -KILL -u tester -x Hyprland; i=0; while [ $i -lt 60 ]; do n=$(pgrep -u tester -x Hyprland | head -1); if [ ${n:-0} -gt 0 ] && [ ${n:-0} -ne ${old:-0} ] && pgrep -u tester -x start-hyprland >/dev/null; then break; fi; sleep 0.5; i=$((i+1)); done; echo hypr=$(pgrep -u tester -c -x Hyprland) launcher=$(pgrep -u tester -c -x start-hyprland) safe=$(pgrep -u tester -af Hyprland | grep -c -e --safe-mode) new=$([ ${n:-0} -ne ${old:-0} ] && echo yes)"
  expect: "hypr=1 launcher=1 safe=0 new=yes"
  caption: QA-LIVE-22, crash 2 after a quiet period restarts again (crash 1 is out of the 30 s window)
- ssh: "pkill -KILL -u tester -x Hyprland; echo killed"
  expect: "killed"
  caption: crash 3, at once after crash 2 (inside REPEAT_WINDOW)
- ssh: "i=0; while [ $i -lt 60 ] && pgrep -u tester -x start-hyprland >/dev/null; do sleep 0.5; i=$((i+1)); done; echo launcher=$(pgrep -u tester -c -x start-hyprland) hypr=$(pgrep -u tester -c -x Hyprland)"
  rc: any
  expect: "launcher=0 hypr=0"
  caption: QA-LIVE-22, the second crash within 30 s ends start-hyprland (exit 1) and the session
- wait-stable:
  timeout: 90
  caption: the login window is back
- shot: login-after-two-crashes
  caption: EXPECT the login window (not a black screen, not a crash loop)
- checkpoint: qa100-ln-shell-crash
- stop
