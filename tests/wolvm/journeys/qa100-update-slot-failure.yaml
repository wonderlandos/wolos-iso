# SPDX-License-Identifier: GPL-2.0-or-later
# QA-100 H2: a system update into the other root slot that FAILS must leave the computer exactly as
# it was: the running slot untouched, no boot entry that points at a deleted slot, the other slot's
# image not deleted while its entry remains, and a second update must not run beside the first.
# Needs a VM made from install-auto.yaml (checkpoint installed-up), network up for the first apply.
# Findings covered: U3 (dangling entry after a failed replace), U4 (no update lock), U5 (Restore
# page offers a deleted slot), U6 (failure sentence names 'wolos-a').
name: a failed slot update leaves no trace, and two updates never run at once
steps:
- start
- wait-agent:
  timeout: 600
- wait-stable:
  timeout: 180
- ssh: "cat /proc/cmdline | tr ' ' '\\n' | grep rootflags; bootctl list --json=short"
  save: before.txt
- ssh: "wol update plan 2>&1"
  rc: any
  save: plan.txt
  caption: the dry run lists the steps (snapshot, pacman, mkinitcpio, seal, esp-sync, set-default)
# First: a good apply of the same release (no --release: [wolos] fixes only), so slot B exists.
- ssh: "timeout 1700 wol update apply --yes >/tmp/apply1.log 2>&1; echo rc=$?; tail -5 /tmp/apply1.log"
  timeout: 1800
  rc: any
  save: apply1.txt
- ssh: "grep -q 'updated into wolos-b' /tmp/apply1.log && echo apply1-ok"
  expect: "apply1-ok"
  caption: slot B built and waits for its first boot
- ssh: "ls /efi/loader/entries; ls /efi/EFI/wolos; btrfs subvolume list /run/wolos/top | grep -o '@wolos-[ab]\\|@wolos-tx'"
  save: after-apply1.txt
- ssh: "test -f /efi/loader/entries/wolos-b+3.conf && test -f /efi/loader/entries/wolos-b-fallback+3.conf && test -f /efi/EFI/wolos/wolos-b.efi && echo b-entry-and-image"
  expect: "b-entry-and-image"
# Boot B, bless it, so A becomes the previous restore point with a blessed entry wolos-a.conf.
- stop
- start
- wait-agent:
  timeout: 600
- wait-stable:
  timeout: 180
- ssh: "cat /proc/cmdline"
  expect: "subvol=@wolos-b"
  caption: the new slot boots
- ssh: "timeout 120 systemctl is-system-running --wait; sleep 10; ls /efi/loader/entries"
  rc: any
  save: entries-after-b-boot.txt
- ssh: "cd /efi/loader/entries || exit 1; a=$(ls | grep -E '^wolos-a([+][0-9]+(-[0-9]+)?)?[.]conf$'); f=$(ls | grep -E '^wolos-a-fallback([+][0-9]+(-[0-9]+)?)?[.]conf$'); [ -n \"$a\" ] && [ -n \"$f\" ] && [ \"$(echo \"$a\" | wc -l)\" = 1 ] && [ \"$(echo \"$f\" | wc -l)\" = 1 ] || { echo a-entries-wrong; ls; exit 1; }; ca=${a#wolos-a}; ca=${ca%.conf}; cf=${f#wolos-a-fallback}; cf=${cf%.conf}; [ \"$ca\" = \"$cf\" ] || { echo a-pair-counters-differ=$ca/$cf; exit 1; }; case \"$ca\" in ''|+1) ;; *) echo a-counter-unexpected=$ca; exit 1;; esac; cd /efi/loader/entries; test -f wolos-b.conf && test -f wolos-b-fallback.conf && [ \"$(ls | grep -c '^wolos-b')\" = 2 ] || { echo b-not-blessed; ls; exit 1; }; test -f /efi/EFI/wolos/wolos-a.efi && test -f /efi/EFI/wolos/wolos-b.efi && echo both-slots-ready=a$ca"
  expect: "both-slots-ready"
  caption: "0.13 boot design (ADR 0025, Fallback entry): the running slot B has its entry and its fallback both blessed (no counter); A, the restore point, has its entry and its fallback with the same counter (blessed, or +1 from its clean shutdown), and both images are there"
# Now a failing update into A: offline, pacman cannot sync. The plan deletes @wolos-a first.
- ssh: "nmcli networking off || true; sleep 2; timeout 900 wol update apply --yes >/tmp/apply2.log 2>&1; echo rc=$?; tail -5 /tmp/apply2.log"
  timeout: 1000
  rc: any
  save: apply2.txt
- ssh: "grep -q 'failed' /tmp/apply2.log && echo apply2-failed-as-expected"
  expect: "apply2-failed-as-expected"
- ssh: "ls /efi/loader/entries /efi/EFI/wolos; btrfs subvolume list /run/wolos/top | grep -o '@wolos-[ab]\\|@wolos-tx'; bootctl list --no-pager"
  rc: any
  save: after-failed-apply.txt
- ssh: "for e in /efi/loader/entries/wolos-a*.conf; do [ -f \"$e\" ] || continue; img=$(sed -n 's/^uki //p' \"$e\"); test -f \"/efi$img\" || { echo dangling=$e; exit 1; }; done; echo no-dangling-entry"
  expect: "no-dangling-entry"
  caption: "U3: no boot entry points at an image or slot that is gone"
- ssh: "if btrfs subvolume list /run/wolos/top | grep -q '@wolos-a$'; then echo slot-a-present; else ls /efi/loader/entries | grep -q '^wolos-a' && echo entry-without-slot || echo slot-a-gone-no-entry; fi"
  rc: any
  save: slot-a-state.txt
  caption: "U3: either the restore point survived, or nothing offers it any more"
# QA-100 B4 (STORE-3 fix): the failed build ran in @wolos-tx; the restore point is kept whole.
- ssh: "btrfs subvolume list /run/wolos/top | grep -q '@wolos-a$' && test -f /efi/EFI/wolos/wolos-a.efi && ! test -e /var/lib/wolos/update-building && (cd /efi/loader/entries || exit 1; a=$(ls | grep -E '^wolos-a([+][0-9]+(-[0-9]+)?)?[.]conf$'); f=$(ls | grep -E '^wolos-a-fallback([+][0-9]+(-[0-9]+)?)?[.]conf$'); [ -n \"$a\" ] && [ -n \"$f\" ] && [ \"$(echo \"$a\" | wc -l)\" = 1 ] && [ \"$(echo \"$f\" | wc -l)\" = 1 ] || { echo a-entries-wrong; ls; exit 1; }; ca=${a#wolos-a}; ca=${ca%.conf}; cf=${f#wolos-a-fallback}; cf=${cf%.conf}; [ \"$ca\" = \"$cf\" ] || { echo a-pair-counters-differ=$ca/$cf; exit 1; }; case \"$ca\" in ''|+1) ;; *) echo a-counter-unexpected=$ca; exit 1;; esac; echo restore-point-kept)"
  expect: "restore-point-kept"
  caption: "STORE-3: after a failed update the earlier restore point, its entry, its fallback entry (same counter as before) and its image are all still there"
- ssh: "grep -cE 'wolos-a|btrfs|/run/wolos' /tmp/apply2.log | grep -q '^0$' && echo plain-sentence"
  expect: "plain-sentence"
  caption: "STORE-6/55: the failure says it in words (no slot name, no commands)"
- ssh: "wol restore list 2>&1; wol restore list --json 2>&1"
  rc: any
  save: restore-list.txt
- ssh: "{ wol restore list --json | grep -o '\"name\":\"wolos-a\"' | wc -l | grep -q '^0$' || btrfs subvolume list /run/wolos/top | grep -q '@wolos-a$'; } && echo restore-list-honest"
  expect: "restore-list-honest"
  caption: "U5: the Restore page never offers a slot that does not exist"
- ssh: "nmcli networking on || true; sleep 5"
  rc: any
# U4: two updates at once. The second must refuse at once (a lock), not race the first.
- ssh: "(timeout 1700 wol update apply --yes >/tmp/apply3.log 2>&1; echo rc=$? >>/tmp/apply3.log) & sleep 3; timeout 60 wol update apply --yes >/tmp/apply4.log 2>&1; echo second-rc=$?; cat /tmp/apply4.log"
  timeout: 120
  rc: any
  save: concurrent.txt
- ssh: "grep -qiE 'already|in progress|another update|lock' /tmp/apply4.log && echo second-refused"
  expect: "second-refused"
  caption: "U4: a second update while one runs is refused with a sentence, not run beside it"
# U4 (wol-admind half, QA-100 B1): Update Now from Settings is the same admin request; it must not
# start a second slot build beside the running one either, and must say why.
- ssh: "wol admin pkg-upgrade </dev/null >/tmp/apply5.log 2>&1; echo update-now-rc=$?; cat /tmp/apply5.log; journalctl -t wol-admind -b --no-pager -n 20 | grep -i 'another update' || true"
  timeout: 120
  rc: any
  save: update-now-while-locked.txt
- ssh: "grep -qi 'another update is running' /tmp/apply5.log && echo update-now-refused"
  expect: "update-now-refused"
  caption: "U4: Update Now while a slot update runs is refused with the sentence, and nothing started"
- ssh: "n=0; while [ $n -lt 1700 ] && ! grep -q '^rc=' /tmp/apply3.log; do sleep 5; n=$((n+5)); done; tail -3 /tmp/apply3.log"
  timeout: 1800
  rc: any
  save: apply3.txt
- ssh: "btrfs subvolume list /run/wolos/top | grep -c '@wolos-tx' | grep -q '^0$' && echo no-scratch-left"
  expect: "no-scratch-left"
  caption: no scratch subvolume is left behind
- logs:
  n: 600
- stop
